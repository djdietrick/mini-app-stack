x-restart: &default-restart
  restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  postgres_data:
  mongo_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    <<: *default-restart
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-appstack}
      APP_CRATE_PASSWORD: ${APP_CRATE_PASSWORD:?set APP_CRATE_PASSWORD in .env}
      APP_AUTH_PASSWORD: ${APP_AUTH_PASSWORD:?set APP_AUTH_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  mongo:
    image: mongo:7
    <<: *default-restart
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      APP_MONGO_PASSWORD: ${APP_MONGO_PASSWORD:?set APP_MONGO_PASSWORD in .env}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  redis:
    image: redis:7-alpine
    <<: *default-restart
    command:
      - redis-server
      - /usr/local/etc/redis/redis.conf
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
      - ./infra/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [appnet]

  auth:
    build:
      context: .
      dockerfile: apps/auth/Dockerfile
    <<: *default-restart
    environment:
      AUTH_PORT: 3000
      DATABASE_URL: postgres://auth_writer:${APP_AUTH_PASSWORD:?set APP_AUTH_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-appstack}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-stack_session}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      AUTH_SESSION_TTL_SECONDS: ${AUTH_SESSION_TTL_SECONDS:-2592000}
      AUTH_VERIFY_SECRET: ${AUTH_VERIFY_SECRET:?set AUTH_VERIFY_SECRET in .env}
    ports:
      - "${AUTH_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]

  crate:
    build:
      context: .
      dockerfile: apps/crate/Dockerfile
    <<: *default-restart
    environment:
      CRATE_PORT: 3001
      DATABASE_URL: postgres://crate:${APP_CRATE_PASSWORD:?set APP_CRATE_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-appstack}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      AUTH_URL: http://auth:3000
      AUTH_VERIFY_SECRET: ${AUTH_VERIFY_SECRET:?set AUTH_VERIFY_SECRET in .env}
      AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-stack_session}
    ports:
      - "${CRATE_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [appnet]
