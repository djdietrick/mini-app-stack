# Lean Redis config for a small home server.
# Auth is set on the CLI via --requirepass in docker-compose.yml.

bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: AOF gives durable-enough writes for a small home setup.
appendonly yes
appendfsync everysec

# Cap memory so Redis can't starve the host.
maxmemory 256mb
maxmemory-policy allkeys-lru

# Logical databases — apps can use separate db numbers (0-15) if not running
# their own keyspace prefix.
databases 16
