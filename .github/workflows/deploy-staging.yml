name: Deploy staging preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

# One deploy per PR at a time. Note this does NOT serialise across PRs — see
# the shared-staging caveat below.
concurrency:
  group: deploy-staging-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

# What a preview actually is, so nobody is surprised:
#
#   Hosting preview channels fork the FRONTEND only. Functions, Firestore data
#   and Auth users are NOT forked — every PR preview points at the one shared
#   staging project. Consequences:
#     * two PRs that change the API incompatibly will break each other
#     * PR previews share data
#   Frontend-only and additive PRs are fine. For an API-breaking PR, deploy its
#   functions under a suffixed id (crateApi-pr123) and point that PR's rewrite
#   at it.
#
# Terraform is deliberately not applied here — a PR must not be able to mutate
# infrastructure. terraform.yml plans on PRs; deploy-prod.yml applies on merge.

jobs:
  preview:
    name: Build and deploy preview
    # Staging is opt-in: until the STAGING_PROJECT_ID repository variable is
    # set there is no project to deploy to, and the job is skipped rather than
    # failing every PR.
    if: vars.STAGING_PROJECT_ID != ''
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and test
        run: |
          pnpm typecheck
          pnpm test

      - name: Build SPAs against Firebase Auth
        env:
          VITE_AUTH_MODE: firebase
          VITE_FIREBASE_API_KEY: ${{ vars.STAGING_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.STAGING_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.STAGING_PROJECT_ID }}
        run: pnpm build:web

      - name: Build functions bundle
        run: pnpm --filter @stack/functions build

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      # Must come before the functions deploy. crate's listQueue combines a
      # userId equality filter with an addedAt ordering, which Firestore serves
      # only from a composite index; without this step GET /api/queue fails
      # with FAILED_PRECONDITION. The emulator does not enforce index
      # requirements, so this gap is invisible locally.
      - name: Deploy Firestore rules and indexes to staging
        run: |
          pnpm exec firebase deploy --only firestore \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --non-interactive --force

      - name: Deploy functions to staging
        env:
          # Bind each function to its own runtime identity instead of the
          # default compute service account. Read at deploy time by
          # functions/src/index.ts.
          CRATE_FUNCTION_SA: ${{ vars.STAGING_CRATE_FUNCTION_SA }}
          PANTRY_FUNCTION_SA: ${{ vars.STAGING_PANTRY_FUNCTION_SA }}
          YTDIGEST_FUNCTION_SA: ${{ vars.STAGING_YTDIGEST_FUNCTION_SA }}
          # ytdigest's non-secret mail settings. SMTP_PASSWORD is in Secret
          # Manager, bound in functions/src/index.ts.
          SMTP_HOST: ${{ vars.STAGING_SMTP_HOST }}
          SMTP_PORT: ${{ vars.STAGING_SMTP_PORT }}
          SMTP_USER: ${{ vars.STAGING_SMTP_USER }}
          MAIL_FROM: ${{ vars.STAGING_MAIL_FROM }}
          AUTH_FUNCTION_SA: ${{ vars.STAGING_AUTH_FUNCTION_SA }}
        run: |
          : "${CRATE_FUNCTION_SA:?set the STAGING_CRATE_FUNCTION_SA repository variable}"
          : "${PANTRY_FUNCTION_SA:?set the STAGING_PANTRY_FUNCTION_SA repository variable}"
          : "${AUTH_FUNCTION_SA:?set the STAGING_AUTH_FUNCTION_SA repository variable}"
          : "${YTDIGEST_FUNCTION_SA:?set the STAGING_YTDIGEST_FUNCTION_SA repository variable}"
          : "${SMTP_HOST:?set the STAGING_SMTP_HOST repository variable}"
          : "${SMTP_USER:?set the STAGING_SMTP_USER repository variable}"
          : "${MAIL_FROM:?set the STAGING_MAIL_FROM repository variable}"
          # The Firebase CLI deploys functions/.env as the functions' runtime
          # environment. Git-ignored; it only ever exists on the runner.
          {
            printf 'SMTP_HOST=%s\n' "$SMTP_HOST"
            printf 'SMTP_PORT=%s\n' "${SMTP_PORT:-587}"
            printf 'SMTP_USER=%s\n' "$SMTP_USER"
            printf 'MAIL_FROM="%s"\n' "$MAIL_FROM"
          } > functions/.env
          pnpm exec firebase deploy --only functions \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --non-interactive --force

      - name: Deploy frontend to a preview channel
        id: preview
        run: |
          pnpm exec firebase hosting:channel:deploy "pr-${{ github.event.number }}" \
            --project "${{ vars.STAGING_PROJECT_ID }}" \
            --expires 7d --json > channel.json
          node -e "
            const r = require('./channel.json').result ?? {};
            const urls = Object.values(r).map(v => v.url).filter(Boolean);
            require('fs').appendFileSync(process.env.GITHUB_OUTPUT, 'urls=' + JSON.stringify(urls) + '\n');
          "

      - name: Comment preview URLs
        uses: actions/github-script@v7
        with:
          script: |
            const urls = JSON.parse(process.env.URLS || '[]');
            const list = urls.length
              ? urls.map((u) => `- ${u}`).join('\n')
              : '_No Hosting targets produced a URL._';
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Staging preview',
                '',
                list,
                '',
                'Frontend is per-PR; **Functions and Firestore are shared staging**, so',
                'concurrent PRs see each other\'s API and data. Channel expires in 7 days.',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
        env:
          URLS: ${{ steps.preview.outputs.urls }}
