name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Typecheck and build
    runs-on: ubuntu-latest

    # Real Postgres, so the self-hosted repos are tested against the actual
    # SQL rather than only the Firestore side. Same major version as
    # docker-compose.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: appstack
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build SPAs
        run: pnpm build:web

      - name: Build functions bundle
        run: pnpm --filter @stack/functions build

      # The Firestore emulator is a Java program, and firebase-tools refuses
      # to start it on anything older than Java 21. The runner's default Java
      # is older, so pin it rather than rely on the image.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The same init scripts docker-compose mounts, so the schemas, roles and
      # grants under test are the ones production gets.
      - name: Provision Postgres like the Docker stack
        working-directory: infra/postgres/init
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: appstack
          POSTGRES_USER: postgres
          POSTGRES_DB: appstack
          APP_AUTH_PASSWORD: auth
        run: |
          psql -v ON_ERROR_STOP=1 -f 00-extensions.sql
          psql -v ON_ERROR_STOP=1 -f 05-shared-schema.sql
          bash 07-auth-role.sh
          bash 10-app-schemas.sh

      # Run the suite inside the Firestore emulator so the Firestore repos'
      # contract tests actually execute. Without it those suites self-skip and
      # the cloud data layer would go untested. The Postgres URLs do the same
      # for the self-hosted side; app roles get their name as password when
      # APP_<NAME>_PASSWORD is unset, which it is here.
      - name: Test
        env:
          # apps/auth's Google sign-in tests run as auth_writer, so its grants
          # are tested as well as its SQL.
          AUTH_TEST_DATABASE_URL: postgres://auth_writer:auth@localhost:5432/appstack
          PANTRY_TEST_DATABASE_URL: postgres://pantry:pantry@localhost:5432/appstack
          PANTRY_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/appstack
          YTDIGEST_TEST_DATABASE_URL: postgres://ytdigest:ytdigest@localhost:5432/appstack
          YTDIGEST_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/appstack
          FRETWORK_TEST_DATABASE_URL: postgres://fretwork:fretwork@localhost:5432/appstack
          FRETWORK_TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/appstack
        run: >
          pnpm exec firebase emulators:exec
          --only firestore --project demo-ci
          "pnpm test"
