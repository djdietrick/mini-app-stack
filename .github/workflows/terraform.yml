name: Terraform

on:
  pull_request:
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"

# Terraform state is a shared resource; never let two plans race.
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write        # required to mint the OIDC token for GCP
  pull-requests: write   # to comment the plan

jobs:
  plan:
    name: Plan ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [staging, prod]

    defaults:
      run:
        working-directory: infra/terraform/envs/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Check formatting
        run: terraform fmt -check -recursive -diff ../..

      # No long-lived service account key: GitHub mints an OIDC token that the
      # Workload Identity pool exchanges for short-lived GCP credentials.
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Init
        run: terraform init -input=false -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"

      - name: Validate
        run: terraform validate

      - name: Plan
        id: plan
        run: |
          terraform plan -input=false -no-color -out=tfplan | tee plan.txt
          echo "exitcode=$?" >> "$GITHUB_OUTPUT"

      - name: Comment plan on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'infra/terraform/envs/${{ matrix.env }}/plan.txt';
            let plan = fs.readFileSync(path, 'utf8');
            // GitHub caps a comment at 65536 chars; keep the tail, which holds
            // the summary line.
            const LIMIT = 60000;
            if (plan.length > LIMIT) plan = '...truncated...\n' + plan.slice(-LIMIT);
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: [
                '### Terraform plan — `${{ matrix.env }}`',
                '',
                '<details><summary>Show plan</summary>',
                '',
                '```terraform',
                plan,
                '```',
                '',
                '</details>',
                '',
                '---',
                '_Generated by [Claude Code](https://claude.ai/code)_',
              ].join('\n'),
            });
